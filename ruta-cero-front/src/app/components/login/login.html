<div class="auth-page">
  <div class="auth-bg" aria-hidden="true"></div>
  <div class="auth-overlay" aria-hidden="true"></div>

  <div class="auth-card">
    <div class="auth-card-inner">
      <div class="auth-header">
        <div class="logo">
          <span class="logo-ruta">Ruta</span><span class="logo-zero">0</span>
        </div>
        <p class="tagline">Tu guía inteligente para descubrir Quito</p>
      </div>

      <form (ngSubmit)="login()" class="auth-form" autocomplete="off">
        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <div class="input-wrapper">
            <span class="input-icon material-icons">mail_outline</span>
            <input
              id="email"
              type="email"
              placeholder="tu@email.com"
              [value]="email()"
              (input)="actualizarEmail($event)"
              autocomplete="email"
            />
          </div>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <div class="input-wrapper">
            <span class="input-icon material-icons">lock_outline</span>
            <input
              id="password"
              type="password"
              placeholder="Ingresa tu contraseña"
              [value]="password()"
              (input)="actualizarPassword($event)"
              (keydown.enter)="login()"
              autocomplete="current-password"
            />
          </div>
        </div>

        @if (errores().length > 0) {
          <div class="error-box" role="alert">
            <span class="material-icons">error_outline</span>
            <div>
              @for (err of errores(); track err) {
                <p>{{ err }}</p>
              }
            </div>
          </div>
        }

        <button type="submit" class="btn-auth" [disabled]="cargando()">
          @if (cargando()) {
            <span class="spinner"></span>
            <span>Ingresando...</span>
          } @else {
            <span>Iniciar Sesión</span>
          }
        </button>
      </form>

      <div class="auth-footer">
        <p>¿No tienes cuenta? <a routerLink="/register">Crear cuenta</a></p>
      </div>
    </div>
  </div>
</div>
