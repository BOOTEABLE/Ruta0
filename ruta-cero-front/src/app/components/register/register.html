<div class="auth-page">
  <div class="auth-bg" aria-hidden="true"></div>
  <div class="auth-overlay" aria-hidden="true"></div>

  <div class="auth-card">
    <div class="auth-card-inner">
      <div class="auth-header">
        <div class="logo">
          <span class="logo-ruta">Ruta</span><span class="logo-zero">0</span>
        </div>
        <p class="tagline">Crea tu cuenta y empieza a explorar</p>
      </div>

      <form (ngSubmit)="registrar()" class="auth-form" autocomplete="off">
        <div class="form-group">
          <label for="nombre">Nombre completo</label>
          <div class="input-wrapper">
            <span class="input-icon material-icons">person_outline</span>
            <input
              id="nombre"
              type="text"
              placeholder="Tu nombre"
              [value]="nombre()"
              (input)="actualizarCampo('nombre', $event)"
              autocomplete="name"
            />
          </div>
        </div>

        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <div class="input-wrapper">
            <span class="input-icon material-icons">mail_outline</span>
            <input
              id="email"
              type="email"
              placeholder="tu@email.com"
              [value]="email()"
              (input)="actualizarCampo('email', $event)"
              autocomplete="email"
            />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="password">Contraseña</label>
            <div class="input-wrapper">
              <span class="input-icon material-icons">lock_outline</span>
              <input
                id="password"
                type="password"
                placeholder="Mín. 6 caracteres"
                [value]="password()"
                (input)="actualizarCampo('password', $event)"
                autocomplete="new-password"
              />
            </div>
          </div>

          <div class="form-group">
            <label for="confirmarPassword">Confirmar</label>
            <div class="input-wrapper">
              <span class="input-icon material-icons">lock</span>
              <input
                id="confirmarPassword"
                type="password"
                placeholder="Repite la contraseña"
                [value]="confirmarPassword()"
                (input)="actualizarCampo('confirmarPassword', $event)"
                (keydown.enter)="registrar()"
                autocomplete="new-password"
              />
            </div>
          </div>
        </div>

        @if (errores().length > 0) {
          <div class="error-box" role="alert">
            <span class="material-icons">error_outline</span>
            <div>
              @for (err of errores(); track err) {
                <p>{{ err }}</p>
              }
            </div>
          </div>
        }

        <button type="submit" class="btn-auth" [disabled]="cargando()">
          @if (cargando()) {
            <span class="spinner"></span>
            <span>Creando cuenta...</span>
          } @else {
            <span>Crear Cuenta</span>
          }
        </button>
      </form>

      <div class="auth-footer">
        <p>¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
      </div>
    </div>
  </div>
</div>
